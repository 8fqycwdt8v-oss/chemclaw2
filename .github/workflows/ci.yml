name: CI
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chemclaw2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python MCP servers
        run: |
          pip install packages/mcp-servers/mcp_molfp packages/mcp-servers/mcp_rxnfp

      - name: Assert DRFP produces 2048 bits
        run: |
          python -c "
          from drfp import DrfpEncoder
          fps = DrfpEncoder.encode(['CC>>CCC'], n_folded_length=2048)
          assert len(fps[0]) == 2048, f'Expected 2048 bits, got {len(fps[0])}'
          print('DRFP 2048-bit assertion passed')
          "

      - name: Run migrations
        run: pnpm --filter @chemclaw2/db migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/chemclaw2_test

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/chemclaw2_test

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/chemclaw2_test
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsubG9jYWxob3N0JA==
          CLERK_SECRET_KEY: sk_test_placeholder
          ANTHROPIC_API_KEY: sk-ant-placeholder
          LANGFUSE_PUBLIC_KEY: pk-lf-placeholder
          LANGFUSE_SECRET_KEY: sk-lf-placeholder
          OPENAI_API_KEY: sk-placeholder
