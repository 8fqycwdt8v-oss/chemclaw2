name: CI
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chemclaw2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -e ".[dev]"

      - name: Install MCP servers
        run: |
          pip install packages/mcp-servers/mcp_molfp packages/mcp-servers/mcp_rxnfp

      - name: Assert DRFP produces 2048 bits
        run: |
          python -c "
          from drfp import DrfpEncoder
          fps = DrfpEncoder.encode(['CC>>CCC'], n_folded_length=2048)
          assert len(fps[0]) == 2048, f'Expected 2048 bits, got {len(fps[0])}'
          print('DRFP 2048-bit assertion passed')
          "

      - name: Run migrations
        run: |
          for f in migrations/*.sql; do
            psql "$DATABASE_URL" -f "$f"
          done
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/chemclaw2_test

      - name: Test
        run: pytest api/ -v
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/chemclaw2_test
          ANTHROPIC_API_KEY: sk-ant-placeholder
          OPENAI_API_KEY: sk-placeholder
          CLERK_SECRET_KEY: sk_test_placeholder
