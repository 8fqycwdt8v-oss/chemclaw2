name: CI
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

# Grant pull-requests + issues write so the "Post mypy errors as PR
# comment" step can create / update comments. Other permissions stay
# read-only by default.
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ci:
    # Matrix lanes:
    #   - cheap (default): no heavy extras. Asserts the [tabicl] extra is
    #     not installed; bofire/aizynth-gated tests skip via importorskip.
    #   - heavy: installs [opt,retrosynth] + matplotlib so the bofire GP
    #     path, the AiZynthFinder smoke wrapper, and the sandbox figure-
    #     capture test all execute against real deps.
    strategy:
      fail-fast: false
      matrix:
        lane: [cheap, heavy]
    runs-on: ubuntu-latest
    name: ci (${{ matrix.lane }})
    # The heavy lane installs ~2 GB of torch + bofire + aizynthfinder and
    # is the first time chemclaw2 exercises those import chains in CI.
    # Mark it non-blocking initially so a heavy-lane-only environmental
    # hiccup (install timeout, transitive-dep clash) doesn't stop the
    # PR pipeline. The cheap lane stays the gating check; the heavy lane
    # is an informational signal and a regression net for the [opt] +
    # [retrosynth] surfaces. Once it has 5 consecutive green runs on
    # main, flip this to false and make it gating. Tracked in BACKLOG.md.
    continue-on-error: ${{ matrix.lane == 'heavy' }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chemclaw2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies (cheap)
        if: matrix.lane == 'cheap'
        run: pip install -e ".[dev]"

      - name: Install Python dependencies (heavy)
        # Heavy lane installs the [opt] (bofire+torch) and [retrosynth]
        # (aizynthfinder) extras plus matplotlib so figure-capture lands
        # a real PNG. Skipped on the cheap lane to keep its install
        # under 60s; ~2 GB extra wheels on the heavy lane.
        if: matrix.lane == 'heavy'
        run: pip install -e ".[dev,opt,retrosynth]" matplotlib

      - name: Install MCP servers
        run: |
          pip install packages/mcp-servers/mcp_molfp packages/mcp-servers/mcp_rxnfp packages/mcp-servers/mcp_retrosynth packages/mcp-servers/mcp_rxn_conditions packages/mcp-servers/mcp_codesandbox packages/mcp-servers/mcp_tabular

      - name: Assert mcp_tabular imports + tabicl lazy guard
        # Only meaningful on the cheap lane — that's where the lazy
        # guard's "tabicl extra not installed" branch is exercised.
        # Heavy lane skips since it could legitimately have tabicl
        # installed by a future change.
        if: matrix.lane == 'cheap'
        run: |
          python -c "
          import mcp_tabular.server  # noqa
          from mcp_tabular import tabicl_runtime
          status = tabicl_runtime.status()
          assert status['installed'] is False, 'CI must not install the [tabicl] extra; got installed=True'
          import pytest
          with pytest.raises(RuntimeError, match='tabicl extra not installed'):
              tabicl_runtime.get_classes()
          print('mcp_tabular smoke + tabicl lazy guard OK')
          "

      - name: Lint (ruff)
        run: ruff check api/ packages/

      - name: Type-check (mypy)
        # Hard gate again. The CI-vs-local mypy drift that motivated the
        # earlier `continue-on-error: true` workaround was four
        # `result.rowcount` accesses missing `# type: ignore[attr-defined]`
        # markers — CI's SQLAlchemy stubs are stricter than local 1.19.1
        # about the `Result` vs `CursorResult` distinction. Now annotated;
        # mypy gate re-enabled in this PR.
        shell: bash
        run: |
          set -o pipefail
          mypy api/ --show-error-codes --no-error-summary 2>&1 | tee /tmp/mypy.log

      - name: Surface mypy failures as annotations
        if: failure()
        shell: bash
        run: |
          if [ -f /tmp/mypy.log ]; then
            echo "::group::mypy output"
            cat /tmp/mypy.log
            echo "::endgroup::"
            # Emit each error: line as a ::error:: annotation so the
            # PR check summary lists them directly.
            grep -E "error:" /tmp/mypy.log | head -100 \
              | sed 's/^/::error::/' || true
          fi

      - name: Mypy log to step summary
        # Runs on every PR run, success or failure, so the dump-and-
        # annotate output is visible in the Actions UI's `Summary`
        # tab without scrolling through logs. Also writes the same
        # content as a PR comment below for tooling access.
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/mypy.log ] && [ -s /tmp/mypy.log ]; then
            {
              echo "## mypy output (CI run)"
              echo ""
              echo '```'
              cat /tmp/mypy.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Post mypy errors as PR comment
        # On pull_request events only, comment the mypy log onto the PR
        # if it contains any error lines. Gives tooling without raw-log
        # access a way to read CI's actual mypy output via the GitHub
        # API. Idempotent: searches for an existing comment with the
        # marker and updates rather than appending a new one each push.
        # Restricted to the cheap lane so cheap + heavy don't race to
        # update the same comment.
        if: matrix.lane == 'cheap' && github.event_name == 'pull_request' && always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -f /tmp/mypy.log ] || [ ! -s /tmp/mypy.log ]; then
            echo "no mypy.log; skipping comment"
            exit 0
          fi
          if ! grep -qE "error:" /tmp/mypy.log; then
            echo "mypy.log present but no errors; skipping comment"
            exit 0
          fi
          marker="<!-- chemclaw2-mypy-ci-output -->"
          {
            echo "$marker"
            echo "**mypy CI output** (run ${{ github.run_id }})"
            echo ""
            echo '```'
            head -200 /tmp/mypy.log
            echo '```'
          } > /tmp/mypy-comment.md
          # `gh api -f body=...` sends a JSON-encoded form field, which
          # is what the issues comments endpoint expects. Use jq to
          # build the JSON payload so newlines and quotes in the log
          # don't break the shell escaping.
          body_json=$(jq -Rs '{body: .}' < /tmp/mypy-comment.md)
          # Find existing comment by marker; update if present, else create.
          # `jq -s '.[0] // empty'` slurps the (small) array and pops the
          # first match — avoids the SIGPIPE risk of piping `--paginate`
          # to `head -1` (which closes the pipe early and can lose the
          # match under set -o pipefail).
          existing=$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
                       --paginate \
                       --jq "[.[] | select(.body | contains(\"$marker\")) | .id] | .[0] // empty")
          if [ -n "$existing" ]; then
            echo "$body_json" | gh api -X PATCH \
              "repos/${{ github.repository }}/issues/comments/$existing" \
              --input -
          else
            echo "$body_json" | gh api -X POST \
              "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
              --input -
          fi

      - name: Upload mypy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-log-${{ matrix.lane }}
          path: /tmp/mypy.log
          if-no-files-found: ignore

      - name: Assert DRFP produces 2048 bits
        run: |
          python -c "
          from drfp import DrfpEncoder
          fps = DrfpEncoder.encode(['CC>>CCC'], n_folded_length=2048)
          assert len(fps[0]) == 2048, f'Expected 2048 bits, got {len(fps[0])}'
          print('DRFP 2048-bit assertion passed')
          "

      - name: Run migrations
        # --single-transaction wraps each file so partial failure rolls
        # back the whole file; ON_ERROR_STOP fails the step on first
        # SQL error; `set -e` fails the loop on the first failing file.
        #
        # Special case: files that contain a `CREATE INDEX CONCURRENTLY`
        # or `REINDEX ... CONCURRENTLY` statement cannot run inside a
        # transaction, so they're applied with autocommit. Per
        # MIGRATIONS.md, those files must be single-statement so
        # ON_ERROR_STOP suffices for atomicity. The regex matches only
        # real DDL — a comment mentioning the word `CONCURRENTLY` won't
        # trip the autocommit path.
        run: |
          set -e
          for f in migrations/*.sql; do
            echo "applying $f"
            if grep -Eqi "CREATE[[:space:]]+INDEX[[:space:]]+CONCURRENTLY|REINDEX.*CONCURRENTLY" "$f"; then
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
            else
              psql "$DATABASE_URL" --single-transaction \
                -v ON_ERROR_STOP=1 -f "$f"
            fi
          done
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/chemclaw2_test

      - name: Test
        # `tee` so the full pytest output lands in a file we can both upload
        # as an artifact and tail into ::error annotations on failure.
        # set -o pipefail so pytest's exit code reaches the shell.
        shell: bash
        run: |
          set -o pipefail
          pytest api/ -v --tb=long --color=no 2>&1 | tee /tmp/pytest.log
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/chemclaw2_test
          ANTHROPIC_API_KEY: sk-ant-placeholder
          OPENAI_API_KEY: sk-placeholder
          CLERK_SECRET_KEY: sk_test_placeholder

      - name: Surface pytest failures as annotations
        if: failure()
        shell: bash
        run: |
          # Emit the last 200 lines of pytest output as a GH Actions error
          # annotation so it's visible in the PR check summary even when
          # the raw log is paywalled behind sign-in.
          if [ -f /tmp/pytest.log ]; then
            echo "::group::pytest tail"
            tail -200 /tmp/pytest.log
            echo "::endgroup::"
            # Single annotation with the failing-test summary.
            grep -E "FAILED|ERROR" /tmp/pytest.log | tail -50 \
              | sed 's/^/::error::/' || true
          fi

      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ matrix.lane }}
          path: /tmp/pytest.log
          if-no-files-found: ignore
