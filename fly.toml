app = "chemclaw2"
primary_region = "fra"

[build]

[env]
  PORT = "8080"

[processes]
  # Production-tuned uvicorn:
  #   --workers 2           — two worker processes per machine (1-GB VM).
  #                           Scale via Fly machines, not uvicorn workers.
  #   --timeout-keep-alive  — drop idle conns aggressively so Fly's
  #                           connection pool doesn't grow unbounded.
  #   --timeout-graceful-shutdown
  #                         — give in-flight requests 30 s to drain on
  #                           SIGTERM before forcing a kill (paired with
  #                           Fly's rolling-deploy default).
  #   --proxy-headers / --forwarded-allow-ips
  #                         — trust Fly's edge proxy so request.client.host
  #                           reflects the real client IP for rate limiting.
  web = "uvicorn api.main:app --host 0.0.0.0 --port 8080 --workers 2 --timeout-keep-alive 30 --timeout-graceful-shutdown 30 --proxy-headers --forwarded-allow-ips=*"
  worker = "python -m api.workers.fp_worker"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

  # Liveness — process up + event loop responsive. Failure restarts the
  # machine. Aggressive interval; cheap probe (no DB).
  [[http_service.checks]]
    grace_period = "10s"
    interval = "10s"
    method = "GET"
    path = "/api/health"
    timeout = "3s"

  # Readiness — DB ping + fingerprint backlog gate. Failure should drain
  # traffic without restarting (Fly's HTTP-check failure stops routing
  # new requests, which is the intent of the wave-5 split). Slower
  # interval since this hits Postgres.
  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/readiness"
    timeout = "5s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
  processes = ["web"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
  processes = ["worker"]
