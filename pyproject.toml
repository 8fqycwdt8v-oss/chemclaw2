[project]
name = "chemclaw2-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "claude-agent-sdk>=0.2.82",
  "anthropic>=0.40",
  "openai>=1.50",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.28",
  "python-multipart>=0.0.9",
  "pgvector>=0.3",
  "pypdf>=5.0",
  # Office-document text extraction for the ingest pipeline (upload route +
  # drive sync). Off-the-shelf parsers; imported lazily inside their handlers.
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "openpyxl>=3.1",
  # Microsoft Graph app-only auth (client-credentials) for SharePoint/
  # OneDrive drive sync. Off-the-shelf token acquisition + caching; the
  # Graph data calls reuse the shared SSRF-pinned httpx helper.
  "msal>=1.31",
  # Postgres-first observability: prometheus-client is the off-the-shelf
  # scraping surface (no Datadog/Sentry agent). 13 KB pure-python wheel,
  # zero transitive deps.
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "httpx>=0.28",
  # Pinned: mypy 1.19 ships meaningfully stricter checks on
  # SQLAlchemy result types; older 1.x versions silenced things the
  # new one flags (and vice versa). Pin so CI and contributors see the
  # same diagnostics.
  "mypy==1.19.1",
  "ruff>=0.6",
  "pip-audit>=2.7",
]
chem = [
  "rdkit>=2024.3,!=2026.3.3",
  "drfp>=0.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["api"]

[tool.coverage.run]
source = ["api"]
omit = [
  "api/tests/*",
  # Workers + agent runtime exercise subprocess MCP boundaries; coverage
  # only sees the in-process side anyway, which is misleading.
  "api/workers/*",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E (pycodestyle errors), F (pyflakes), W (warnings) — baseline.
# I — isort. Auto-fixed.
# UP — pyupgrade. Auto-fixed (Optional → X | None, etc.).
# B — bugbear. Catches real bugs (B904 chained raises, B905 strict-zip).
# B008 is widened to permit FastAPI's Depends/Query/Body/Path/Header pattern
# in default arguments (idiomatic for FastAPI routes).
# SIM (simplify), PIE (misc lints), PERF (perf antipatterns) — landed in the
# June 2026 simplification pass; the codebase is clean under all three.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PIE", "PERF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom calls these in default arguments,
# which is the canonical pattern — not a B008 footgun.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Body",
  "fastapi.Path",
  "fastapi.Header",
  "fastapi.Cookie",
  "fastapi.Form",
  "fastapi.File",
]

[tool.ruff.lint.per-file-ignores]
# Tests use a lot of pytest.fixture closures; ignore unused-import noise
# for conftest-style helpers there if it shows up later.
"api/tests/*" = []

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Strict mode was configured but never run in CI. The codebase has
# ~100 type-annotation gaps that would fail it today. Re-enable per-module
# via the [[tool.mypy.overrides]] sections below as each module is cleaned.
# Tracking ticket: BACKLOG "mypy strict adoption".
strict = false
# warn_unused_ignores was on, but the codebase has 17 per-line ignores
# whose "unused" status flips with each mypy minor bump. CI installs
# `mypy>=1.10` (unpinned) so contributors and CI can resolve different
# versions and red-build each other. Leave the existing ignores in
# place — they document why the silencing was needed — and let review
# tidy them when the surrounding code is revisited.
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "claude_agent_sdk.*"
ignore_errors = true

[[tool.mypy.overrides]]
# Local mypy (pinned 1.19.1) is happy with these modules under the
# default config, but the CI mypy resolves stricter SDK stubs that
# enforce the McpSdkServerConfig / AgentDefinition / HookMatcher
# TypedDicts the SDK's own examples ignore. ~12 errors that aren't
# ours to fix — re-enable per module once the SDK ships matching
# stubs.
module = ["api.agent.tools", "api.agent.runner", "api.agent.hooks"]
ignore_errors = true

[[tool.mypy.overrides]]
module = "api.tests.*"
# Tests intentionally omit type annotations on fixture parameters.
disallow_untyped_defs = false
