[project]
name = "chemclaw2-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "claude-agent-sdk>=0.2.82",
  "anthropic>=0.40",
  "openai>=1.50",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.28",
  "python-multipart>=0.0.9",
  "pgvector>=0.3",
  "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "httpx>=0.28",
  # Pinned: mypy 1.19 ships meaningfully stricter checks on
  # SQLAlchemy result types; older 1.x versions silenced things the
  # new one flags (and vice versa). Pin so CI and contributors see the
  # same diagnostics.
  "mypy==1.19.1",
  "ruff>=0.6",
  "pip-audit>=2.7",
]
chem = [
  "rdkit>=2024.3",
  "drfp>=0.3",
]
# Bayesian-optimisation extras for `propose_next_conditions` stage 2.
# Base install does NOT depend on bofire or torch — only deployments that
# need real surrogate-driven BO (≥10 completed campaign outcomes) pay
# the ~2 GB cost. Stage 1 (LHS/random) also requires this extras set
# because bofire's data_models + RandomStrategy live in the same wheel.
opt = [
  "bofire[optimization]>=0.0.13",
]
# Deep retrosynthesis via AiZynthFinder (Tier 3 §H). Opt-in like [opt]
# above — only workers that need full multi-step route search install
# this. AiZynthFinder downloads ~500 MB of demo policy + filter models
# on first call; the cache landing point depends on
# AIZYNTH_CONFIG_PATH (set by the operator if a custom bundle is in
# use, otherwise AiZynthFinder picks a sensible default).
retrosynth = [
  "aizynthfinder>=4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["api"]
markers = [
  # Tests gated behind `[opt]` or `[retrosynth]` extras (bofire, torch,
  # aizynthfinder). Cheap CI lane skips these via `-m "not heavy"`; heavy
  # lane runs them. Use sparingly — prefer `pytest.importorskip` inside the
  # test when the gate is a single import.
  "heavy: requires the heavy install extras (bofire/torch/aizynthfinder)",
]

[tool.coverage.run]
source = ["api"]
omit = [
  "api/tests/*",
  # Workers + agent runtime exercise subprocess MCP boundaries; coverage
  # only sees the in-process side anyway, which is misleading.
  "api/workers/*",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Start narrow: pycodestyle errors (E), pyflakes (F), warnings (W). Isort (I)
# is auto-fixable but its diff is large; add later. Other rule families
# (UP, B, SIM, RUF) deserve their own enabling pass.
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# Tests use a lot of pytest.fixture closures; ignore unused-import noise
# for conftest-style helpers there if it shows up later.
"api/tests/*" = []

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Strict mode was configured but never run in CI. The codebase has
# ~100 type-annotation gaps that would fail it today. Re-enable per-module
# via the [[tool.mypy.overrides]] sections below as each module is cleaned.
# Tracking ticket: BACKLOG "mypy strict adoption".
strict = false
# warn_unused_ignores was on, but the codebase has 17 per-line ignores
# whose "unused" status flips with each mypy minor bump. CI installs
# `mypy>=1.10` (unpinned) so contributors and CI can resolve different
# versions and red-build each other. Leave the existing ignores in
# place — they document why the silencing was needed — and let review
# tidy them when the surrounding code is revisited.
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "claude_agent_sdk.*"
ignore_errors = true

[[tool.mypy.overrides]]
# The Agent SDK's TypedDicts (McpSdkServerConfig, AgentDefinition,
# HookMatcher) don't match how the SDK's own examples use them, producing
# ~30 errors per check. Ignore until the SDK ships better stubs.
module = ["api.agent.tools", "api.agent.runner", "api.agent.hooks"]
ignore_errors = true

[[tool.mypy.overrides]]
module = "api.tests.*"
# Tests intentionally omit type annotations on fixture parameters.
disallow_untyped_defs = false
