[project]
name = "chemclaw2-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "claude-agent-sdk>=0.2.82",
  "anthropic>=0.40",
  "openai>=1.50",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.28",
  "python-multipart>=0.0.9",
  "pgvector>=0.3",
  "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx>=0.28",
  "mypy>=1.10",
  "ruff>=0.6",
]
chem = [
  "rdkit>=2024.3",
  "drfp>=0.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["api"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Start narrow: pycodestyle errors (E), pyflakes (F), warnings (W). Isort (I)
# is auto-fixable but its diff is large; add later. Other rule families
# (UP, B, SIM, RUF) deserve their own enabling pass.
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# Tests use a lot of pytest.fixture closures; ignore unused-import noise
# for conftest-style helpers there if it shows up later.
"api/tests/*" = []

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Strict mode was configured but never run in CI. The codebase has
# ~100 type-annotation gaps that would fail it today. Re-enable per-module
# via the [[tool.mypy.overrides]] sections below as each module is cleaned.
# Tracking ticket: BACKLOG "mypy strict adoption".
strict = false
# warn_unused_ignores was on, but the codebase has 17 per-line ignores
# whose "unused" status flips with each mypy minor bump. CI installs
# `mypy>=1.10` (unpinned) so contributors and CI can resolve different
# versions and red-build each other. Leave the existing ignores in
# place — they document why the silencing was needed — and let review
# tidy them when the surrounding code is revisited.
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "claude_agent_sdk.*"
ignore_errors = true

[[tool.mypy.overrides]]
# The Agent SDK's TypedDicts (McpSdkServerConfig, AgentDefinition,
# HookMatcher) don't match how the SDK's own examples use them, producing
# ~30 errors per check. Ignore until the SDK ships better stubs.
module = ["api.agent.tools", "api.agent.runner", "api.agent.hooks"]
ignore_errors = true

[[tool.mypy.overrides]]
module = "api.tests.*"
# Tests intentionally omit type annotations on fixture parameters.
disallow_untyped_defs = false
