[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-tabular"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=1.0",
  "pandas>=2.1",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "pydantic>=2.6",
]

[project.optional-dependencies]
tabicl = [
  "tabicl>=0.1",
  "torch>=2.2",
]

[project.scripts]
mcp-tabular = "mcp_tabular.server:main"

[tool.hatch.build.targets.wheel]
packages = ["mcp_tabular"]
