[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-rxnfp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=1.0",
  "rdkit>=2024.3",
  "drfp>=0.3",
]

[project.scripts]
mcp-rxnfp = "mcp_rxnfp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["mcp_rxnfp"]
