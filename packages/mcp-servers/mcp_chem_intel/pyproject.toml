[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-chem-intel"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=1.0",
  "rdkit>=2024.3",
]

[project.optional-dependencies]
# ORD-validation rule pack (validate_ord_reaction / _compound) wraps
# ord-schema's own recursive validator — the off-the-shelf ruleset, not a
# hand-rolled one. Behind an extra because ord-schema pulls protobuf / pandas /
# pyarrow; the base server stays light and the tools degrade to a clear error
# envelope when it's absent (see ord_validate._NOT_INSTALLED).
ord = [
  # Pinned to the 0.6.x line: the validate_message / ValidationOptions API the
  # wrappers call is verified against 0.6.5. The >=0.3 floor spanned an
  # incompatible range (0.3.x needs protobuf<3.20; 0.6.x needs protobuf<6) the
  # resolver could backtrack into; the cap locks the API.
  "ord-schema>=0.6,<0.7",
]

[project.scripts]
mcp-chem-intel = "mcp_chem_intel.server:main"

[tool.hatch.build.targets.wheel]
packages = ["mcp_chem_intel"]
